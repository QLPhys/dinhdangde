<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QL_Format</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--ink:#1b2433;--mut:#5b6575;--blue:#0a6cff;--ok:#1f7a3a;--warn:#8a4b00;--err:#a3261f;--line:#cfd8e6}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:14px/1.45 'Segoe UI',system-ui,sans-serif}
.w{padding:14px 16px;display:flex;flex-direction:column;gap:10px;height:100%}
.t{font-size:14.5px} .k-ok .t{color:var(--ok);font-weight:600} .k-warn .t{color:var(--warn)} .k-err .t{color:var(--err)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 14px;cursor:pointer;min-height:36px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
input{font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;width:150px}
.mut{color:var(--mut);font-size:12.5px} .note{font-size:12.5px;color:var(--warn)} .note:empty,.mut:empty{display:none}
pre{white-space:pre-wrap;background:#f5f7fb;border-radius:8px;padding:8px;font-size:12px;margin:0;max-height:120px;overflow:auto}
table{border-collapse:collapse;font-size:12.5px} td{padding:2px 8px 2px 0}
kbd{border:1px solid #c5ccd8;border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px Consolas,monospace;background:#f7f8fa}
.tabs{display:flex;gap:6px} .tabs button{min-height:30px;padding:4px 12px} .tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.gh{font-size:12px;font-weight:700;color:var(--mut);margin:2px 0 -4px;text-transform:uppercase;letter-spacing:.03em}
.gr{display:flex;flex-wrap:wrap;gap:4px} .gr button{min-height:0;width:34px;height:34px;padding:0;font:18px 'Cambria Math','Times New Roman',serif;border-radius:7px}
.gr button:hover{background:#eef4ff;border-color:var(--blue)} .gr button:active{transform:scale(.94)}
textarea{font:13.5px Consolas,monospace;width:100%;min-height:210px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.sb{overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;padding-right:2px} .st{font-size:12.5px;color:var(--ok);min-height:18px}
.it{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:start;border-bottom:1px solid #edf0f5;padding:6px 0}
.it input{width:16px;height:16px;margin-top:3px} .it .src{font:12px Consolas,monospace;color:var(--mut);word-break:break-word} .it .pv{font:16px 'Times New Roman',serif;margin-top:2px} .it .pv math{font-size:1.05em}
.it button{min-height:28px;padding:2px 10px;font-size:12.5px} .hl{background:#fff36b}
body.sym .w{padding:6px 7px;gap:5px} body.sym{font-size:12.5px}
body.sym .tabs{gap:2px;flex-wrap:nowrap} body.sym .tabs button{min-height:0;height:26px;min-width:26px;padding:0 5px;border-radius:6px;font:14px 'Cambria Math','Segoe UI',serif;border-color:transparent;background:#f1f4f9}
body.sym .tabs button.on{background:var(--blue);color:#fff} body.sym #x{background:transparent;font-size:13px}
body.sym .sb{gap:5px} body.sym .gr{gap:3px} body.sym .gr button{width:28px;height:28px;font-size:16px;border-radius:6px}
body.sym .row{gap:4px} body.sym .row input{flex:1;width:auto;font-size:14px;padding:3px 6px} body.sym .row button{min-height:26px;padding:2px 8px;font-size:12px}
body.sym button.lk{border:0;background:none;color:var(--blue);padding:0 2px;min-height:0;text-decoration:underline} body.sym .st{min-height:15px;font-size:11.5px}
body.sym textarea{min-height:90px;font-size:12px} body.sym .mut{font-size:11.5px}
</style></head>
<body><div class="w" id="w"></div>
<script>
(function () {
  const P = new URLSearchParams(location.search), m = P.get('m') || 'msg';
  const W = document.getElementById('w');
  const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const send = (o) => { try { Office.context.ui.messageParent(JSON.stringify(o)); } catch (e) { /* bỏ qua */ } };
  function render() {
    if (m === 'msg') {
      W.className = 'w k-' + (P.get('k') || 'info');
      W.innerHTML = '<div class="t">' + esc(P.get('t')) + '</div><div class="row"><button class="pri" id="ok" type="button">Đóng</button></div>';
      document.getElementById('ok').onclick = () => send({ ok: 1 });
    } else if (m === 'confirm') {
      W.innerHTML = '<div class="t">' + esc(P.get('t')) + '</div><div class="row"><button class="pri" id="y" type="button">' + esc(P.get('y') || 'Đồng ý') + '</button><button id="n" type="button">' + esc(P.get('n') || 'Thôi') + '</button></div>';
      document.getElementById('y').onclick = () => send({ yes: 1 });
      document.getElementById('n').onclick = () => send({ no: 1 });
      document.getElementById('y').focus();
    } else if (m === 'ans') {
      const rd = P.get('rd'), sg = P.get('sg'), nb = +(P.get('bx') || 0);
      W.innerHTML = '<div class="mut">' + esc(P.get('q')) + '</div>'
        + '<div class="row"><b>Đáp án:</b><input id="v" inputmode="decimal" autocomplete="off" value="' + esc(P.get('v') || '') + '"><button class="pri" id="ok" type="button">Ghi vào đề</button><button id="no" type="button">Thôi</button></div>'
        + (sg ? '<div class="row"><button id="sg" type="button">Gợi ý từ lời giải: ' + esc(sg) + '</button></div>' : '')
        + '<div class="mut">' + (rd !== null && rd !== '' ? 'Đề yêu cầu ' + (rd === '0' ? 'lấy phần nguyên' : 'làm tròn ' + rd + ' chữ số thập phân') + '. ' : '') + (nb ? 'Câu có bảng ' + nb + ' ô: mỗi ký tự (kể cả dấu "-" và ",") ghi vào một ô.' : '') + '</div><div class="note" id="nt"></div>';
      const inp = document.getElementById('v'); inp.focus(); inp.select();
      let warned = '';
      const go = () => {
        let v = inp.value.replace(/\s+/g, '').replace(/\./g, ',');
        const nt = document.getElementById('nt');
        if (!v) { nt.textContent = 'Chưa nhập đáp số.'; return; }
        // số kiểu máy tính 1.6e-19 / 6,02E23 -> 1,6.10⁻¹⁹ (ghi dòng "Đáp án:"; không rải vào bảng ô)
        const sci = /^(-?\d+(?:,\d+)?)[eE]([-+]?)(\d{1,3})$/.exec(v);
        if (sci) {
          const SP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
          const t = sci[1] + '.10' + (sci[2] === '-' ? '⁻' : '') + Array.from(sci[3]).map((c) => SP[c]).join('');
          if (warned !== v) { warned = v; nt.textContent = 'Ghi là ' + t + ' (dạng khoa học, dài hơn 4 ô của phiếu trả lời). Bấm "Ghi vào đề" lần nữa để ghi.'; document.getElementById('ok').textContent = 'Vẫn ghi'; return; }
          send({ v: t, sci: 1 }); return;
        }
        if (!/^-?\d+(,\d+)?$/.test(v)) { nt.textContent = 'Đáp số chỉ gồm chữ số, dấu "-" và một dấu phẩy thập phân.'; return; }
        const notes = [];
        if (nb && v.length > nb) notes.push('Đáp số dài ' + v.length + ' ký tự nhưng bảng chỉ có ' + nb + ' ô: sẽ thêm ' + (v.length - nb) + ' ô vào bảng.');
        else if (v.length > 4) notes.push('Đáp số dài ' + v.length + ' ký tự: phiếu trả lời mẫu 2025 chỉ có 4 ô.');
        const dec = v.includes(',') ? v.split(',')[1].length : 0;
        if (rd !== null && rd !== '' && dec !== +rd) notes.push('Đề yêu cầu ' + (rd === '0' ? 'lấy phần nguyên' : 'làm tròn ' + rd + ' chữ số thập phân') + ' nhưng đáp số có ' + dec + ' chữ số thập phân.');
        if (notes.length && warned !== v) { warned = v; nt.textContent = notes.join(' ') + ' Bấm "Ghi vào đề" lần nữa để vẫn ghi.'; document.getElementById('ok').textContent = 'Vẫn ghi'; return; }
        send({ v });
      };
      document.getElementById('ok').onclick = go;
      document.getElementById('no').onclick = () => send({ cancel: 1 });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } if (e.key === 'Escape') send({ cancel: 1 }); });
      const sb = document.getElementById('sg'); if (sb) sb.onclick = () => { inp.value = sg; inp.focus(); };
    } else if (m === 'sym') {
      // bảng ký hiệu NHỎ GỌN: một hàng thẻ nhóm + một lưới ký tự; bấm là chèn tại con nháy, bảng vẫn mở
      let U = {}; try { U = JSON.parse(P.get('u') || '{}') || {}; } catch (e) { U = {}; }
      try { const L = JSON.parse(localStorage.getItem('qlf.sym') || 'null'); if (L && typeof L === 'object') U = Object.assign({}, U, L); } catch (e) { /* bỏ qua */ }
      let pins = typeof U.pins === 'string' ? U.pins : '', sc = typeof U.sc === 'string' ? U.sc : '';
      let rec = ''; try { rec = localStorage.getItem('qlf.symRec') || ''; } catch (e) { rec = ''; }
      const G = [['α', 'Hy Lạp', 'αβγδεζηθκλμνξπρστφψωϕ'], ['Δ', 'Hy Lạp hoa', 'ΔΦΩΣΠΛΓΘΨ'], ['±', 'Phép toán', '±×·÷≈≠≤≥∞√∝⊥∥∠∑∫∂∇'], ['→', 'Mũi tên', '→⇒⇔←↑↓⇌↗'], ['x²', 'Mũ, chỉ số', '⁰¹²³⁴⁻⁺₀₁₂₃₄'], ['°', 'Đơn vị', '°℃ΩμÅ‰%']];
      const save = (rs) => { const v = { pins, sc: rs ? null : sc }; try { localStorage.setItem('qlf.sym', JSON.stringify(v)); } catch (e) { /* bỏ qua */ } send({ save: v }); };
      let tab = '★'; try { tab = localStorage.getItem('qlf.symTab') || '★'; } catch (e) { /* bỏ qua */ }
      let edit = false;
      document.body.classList.add('sym');
      const draw = () => {
        const btns = (str) => '<div class="gr">' + Array.from(str).map((c) => '<button type="button" data-c="' + esc(c) + '" title="Chèn ' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>';
        const tb = (k, title) => '<button type="button" data-t="' + esc(k) + '" title="' + esc(title) + '" class="' + (tab === k ? 'on' : '') + '">' + esc(k) + '</button>';
        let h = '<div class="tabs">' + tb('★', 'Hay dùng: của tôi + vừa chèn') + G.map((g) => tb(g[0], g[1])).join('') + tb('⚙', 'Gõ tắt (lamda → λ…)') + '<span style="flex:1"></span><button type="button" id="x" title="Đóng (Esc)">✕</button></div><div class="sb">';
        if (tab === '★') {
          const all = Array.from(new Set(Array.from(pins + rec))).join('');
          h += all ? btns(all) : '<div class="mut">Các ký hiệu vừa chèn sẽ hiện ở đây.</div>';
          h += edit ? '<div class="row"><input id="pv" value="' + esc(pins) + '" placeholder="ký hiệu của tôi, vd. λΩ℃"><button type="button" id="ps">Lưu</button></div>'
            : '<div class="row"><button type="button" class="lk" id="pe">Sửa ký hiệu của tôi</button>' + (rec ? '<button type="button" class="lk" id="rc">Xóa “vừa chèn”</button>' : '') + '</div>';
        } else if (tab === '⚙') {
          h += '<div class="mut">Mỗi dòng: <b>gõ tắt → ký hiệu</b>. Bấm <b>Equation</b> để đổi: trong công thức gõ <kbd>pi</kbd>, <kbd>lamda</kbd>; ngoài công thức gõ <kbd>\\pi</kbd>.</div>'
            + '<textarea id="sc" spellcheck="false">' + esc(sc) + '</textarea><div class="row"><button class="pri" type="button" id="ss">Lưu</button><button type="button" id="sd">Mặc định</button></div>';
        } else {
          const g = G.find((x) => x[0] === tab) || G[0]; h += btns(g[2]);
        }
        h += '<div class="st" id="st"></div></div>';
        W.innerHTML = h;
        W.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => { tab = b.dataset.t; edit = false; try { localStorage.setItem('qlf.symTab', tab); } catch (e) { /* bỏ qua */ } draw(); }; });
        W.querySelectorAll('[data-c]').forEach((b) => { b.onclick = () => {
          const c = b.dataset.c; send({ ins: c });
          rec = (c + rec.replace(new RegExp(c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), '')).slice(0, 12); try { localStorage.setItem('qlf.symRec', rec); } catch (e) { /* bỏ qua */ }
          document.getElementById('st').textContent = 'Đã chèn ' + c;
        }; });
        document.getElementById('x').onclick = () => send({ close: 1 });
        const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
        on('pe', () => { edit = true; draw(); const v = document.getElementById('pv'); v.focus(); });
        on('rc', () => { rec = ''; try { localStorage.removeItem('qlf.symRec'); } catch (e) { /* bỏ qua */ } draw(); });
        on('ps', () => { pins = Array.from(new Set(Array.from(document.getElementById('pv').value.replace(/\s+/g, '')))).join(''); save(); edit = false; draw(); document.getElementById('st').textContent = 'Đã lưu.'; });
        on('ss', () => { sc = document.getElementById('sc').value.replace(/\r/g, '').trim(); save(); document.getElementById('st').textContent = 'Đã lưu gõ tắt.'; });
        on('sd', () => { save(true); document.getElementById('st').textContent = 'Đã khôi phục mặc định (mở lại bảng để xem).'; });
      };
      draw();
    } else if (m === 'scan') {
      // rà công thức thô cả đề: nhận danh sách qua messageChild, chọn rồi đổi
      W.style.gap = '8px';
      W.innerHTML = '<div class="t">Đang rà đề…</div>';
      let items = [];
      const draw = (msg) => {
        const nOn = items.filter((x) => x.on).length;
        let h = '<div class="row"><b>' + items.length + ' dòng có công thức viết thô</b><span style="flex:1"></span><label class="mut"><input type="checkbox" id="all" style="width:auto" checked> chọn tất cả</label></div><div class="mut">Chỗ <span class="hl">tô vàng</span> là công cụ đoán (số mũ bị rơi khi chép từ PDF), hãy xem kỹ. Bấm "Đến" để xem dòng trong đề.</div><div class="sb">';
        items.forEach((x, k) => { h += '<div class="it"><input type="checkbox" data-k="' + k + '"' + (x.on ? ' checked' : '') + '><div><div class="src">' + esc(x.src) + '</div><div class="pv">' + x.html + '</div></div><button type="button" data-g="' + k + '">Đến</button></div>'; });
        h += '</div><div class="st" id="st">' + esc(msg || '') + '</div><div class="row"><button class="pri" type="button" id="ap">Đổi ' + nOn + ' dòng đã chọn</button><button type="button" id="x">Đóng</button></div>';
        W.innerHTML = h;
        W.querySelectorAll('[data-k]').forEach((c) => { c.onchange = () => { items[+c.dataset.k].on = c.checked; document.getElementById('ap').textContent = 'Đổi ' + items.filter((x) => x.on).length + ' dòng đã chọn'; }; });
        W.querySelectorAll('[data-g]').forEach((b) => { b.onclick = () => send({ go: items[+b.dataset.g].id }); });
        document.getElementById('all').onchange = (e) => { items.forEach((x) => { x.on = e.target.checked; }); draw(); };
        document.getElementById('ap').onclick = () => { const ids = items.filter((x) => x.on).map((x) => x.id); if (!ids.length) return; document.getElementById('st').textContent = 'Đang đổi…'; send({ apply: ids }); };
        document.getElementById('x').onclick = () => send({ close: 1 });
      };
      try {
        Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, (a) => {
          let v = null; try { v = JSON.parse(a.message); } catch (e) { return; }
          if (v.items) { items = v.items.map((x) => Object.assign({ on: true }, x)); draw(); }
          if (v.done != null) { const ids = new Set(v.ids || []); items = items.filter((x) => !ids.has(x.id)); draw('Đã đổi ' + v.done + ' dòng' + (v.skip ? ', bỏ qua ' + v.skip + ' dòng đã bị sửa' : '') + '. Bấm Ctrl+Z trong Word nếu muốn lấy lại.'); }
        });
      } catch (e) { /* bỏ qua */ }
      send({ ready: 1 });
    } else if (m === 'web') {
      const U = 'https://qlphys.github.io/dinhdangde/chinh-thuc/';
      W.innerHTML = '<div class="t">Mở công cụ định dạng đề (bản chính thức) trên trình duyệt.</div><div class="row"><button class="pri" id="go" type="button">Mở công cụ web</button><button id="no" type="button">Đóng</button></div><div class="mut">' + U + '</div>';
      document.getElementById('go').onclick = () => { window.open(U, '_blank'); setTimeout(() => send({ ok: 1 }), 400); };
      document.getElementById('no').onclick = () => send({ ok: 1 });
    } else if (m === 'about') {
      const info = ['QL_Format ' + P.get('v'), 'Word: ' + (P.get('wv') || '?'), 'Lỗi gần đây:', P.get('b') || '(không có)', '', 'Mô tả lỗi: '].join('\n');
      W.innerHTML = '<div class="t"><b>QL_Format</b> · ' + esc(P.get('v')) + '<br><span class="mut" style="display:inline">Định dạng và xuất đề thi Vật lí trong Word · QL Physics</span></div>'
        + '<div><b>Dùng bàn phím (phím Alt):</b> bấm <kbd>Alt</kbd>, Word hiện chữ gợi ý trên từng thẻ; bấm chữ của thẻ <b>QL_Format</b>, rồi bấm chữ hiện trên nút cần dùng.</div>'
        + '<table><tr><td><b>Đúng / Sai</b></td><td>con nháy ở dòng phương án hoặc dòng ý</td></tr><tr><td><b>A B C D</b></td><td>con nháy ở bất kỳ đâu trong câu Phần I</td></tr><tr><td><b>Mức độ, Xóa HDG</b></td><td>bôi đen nhiều câu để làm một lần</td></tr><tr><td><b>Xuất GV + HS</b></td><td>file đang soạn được lưu và giữ nguyên</td></tr></table>'
        + '<div class="row"><button class="pri" id="cp" type="button">Sao chép thông tin lỗi</button><button id="no" type="button">Đóng</button></div><pre id="pi">' + esc(info) + '</pre>';
      document.getElementById('cp').onclick = async () => { try { await navigator.clipboard.writeText(info); document.getElementById('cp').textContent = 'Đã sao chép ✓'; } catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('pi')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); document.getElementById('cp').textContent = 'Đã sao chép ✓'; } };
      document.getElementById('no').onclick = () => send({ ok: 1 });
    }
  }
  if (window.Office && Office.onReady) Office.onReady(render); else render();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && m !== 'ans') send(m === 'sym' || m === 'scan' ? { close: 1 } : { cancel: 1 }); });
})();
</script></body></html>
